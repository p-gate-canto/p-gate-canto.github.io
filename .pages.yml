# Pages CMS の設定（https://app.pagescms.org で編集画面として使う）
# 分野・項目を増減したら、src/consts.ts とこのファイルの両方を直す
media:
- name: images
  label: 画像
  input: public/images
  output: /images
  categories:
  - image
content:
- name: posts
  label: 記事
  type: collection
  path: src/content/posts
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{fields.slug}.md'
  exclude:
  - README.md
  view:
    primary: title
    fields:
    - title
    - category
    - pubDate
    - draft
    sort: pubDate
    order: desc
  fields:
  - name: title
    label: タイトル（結論が伝わる一文）
    type: string
    required: true
  - name: slug
    label: URL用の英字名（半角小文字・数字・ハイフン。例：executive-pay-change）
    type: string
    pattern:
      regex: ^[a-z0-9-]*$
      message: 半角の小文字英字・数字・ハイフン（-）だけで入力してください（例：executive-pay-change）
  - name: description
    label: 要約（一覧と検索結果に出る。60〜100字）
    type: text
    required: true
  - name: pubDate
    label: 公開日
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: updatedDate
    label: 更新日（更新したときだけ）
    type: date
    default: ''
    options:
      format: yyyy-MM-dd
  - name: category
    label: 分野
    type: select
    required: true
    options:
      values:
      - name: strategy
        label: 仕事｜経営戦略
      - name: finance
        label: 仕事｜財務・会計戦略
      - name: tax
        label: 仕事｜税務戦略
      - name: bizdev
        label: 仕事｜事業開発戦略
      - name: ma
        label: 仕事｜M&A・組織再編戦略
      - name: marketing
        label: 仕事｜マーケティング・営業戦略
      - name: hr
        label: 仕事｜組織・人事戦略
      - name: dx
        label: 仕事｜DX・IT・AI戦略
      - name: risk
        label: 仕事｜リスク・ガバナンス戦略
      - name: study
        label: 学び
      - name: self
        label: 自己管理
      - name: tools
        label: ツール
  - name: topic
    label: 項目（分野と同じグループから選ぶ。ツールは空欄）
    type: select
    options:
