# Pages CMS の設定（https://app.pagescms.org で編集画面として使う）
# 分類（中カテゴリー・小カテゴリー・タグ・記事タイプ）は src/data/taxonomy.json と同じ内容にそろえる
media:
- name: images
  label: 画像
  input: public/images
  output: /images
  categories:
  - image
content:
- name: posts
  label: 記事
  type: collection
  path: src/content/posts
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{fields.slug}.md'
  exclude:
  - README.md
  view:
    primary: title
    fields:
    - title
    - type
    - category
    - pubDate
    - draft
    sort: pubDate
    order: desc
  fields:
  - name: title
    label: タイトル（結論が伝わる一文）
    type: string
    required: true
  - name: slug
    label: URL用の英字名（必須。半角小文字・数字・ハイフン。例：executive-pay-change）
    type: string
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: 半角の小文字英字・数字・ハイフン（-）だけで入力してください（例：executive-pay-change）
    required: true
  - name: description
    label: 要約（一覧と検索結果に出る。60〜100字）
    type: text
    required: true
  - name: type
    label: 記事タイプ（見出しの型は「記事の型（テンプレート集）」を参照）
    type: select
    required: true
    default: explainer
    options:
      values:
      - name: explainer
        label: 解説
      - name: comparison
        label: 比較・判断
      - name: checklist
        label: 手順・チェックリスト
      - name: news
        label: 改正ニュース
      - name: glossary
        label: 用語解説
      - name: case
        label: 事例
      - name: study-log
        label: 学習記録
      - name: essay
        label: エッセイ
      - name: tool
        label: ツール紹介
  - name: category
    label: 中カテゴリー（小カテゴリーを選べば自動で補正される）
    type: select
    required: true
    options:
      values:
      - name: strategy
        label: WORK｜経営戦略
      - name: marketing
        label: WORK｜マーケティング
      - name: sales
        label: WORK｜営業
      - name: organization
        label: WORK｜組織
      - name: hr
        label: WORK｜人事・労務
      - name: accounting
        label: WORK｜会計
      - name: tax
        label: WORK｜税務
      - name: finance
        label: WORK｜財務
      - name: operations
        label: WORK｜オペレーション
      - name: dx
        label: WORK｜DX
      - name: innovation
        label: WORK｜イノベーション
      - name: succession
        label: WORK｜事業承継
      - name: ma
        label: WORK｜M&A
      - name: study
        label: GROWTH｜勉強法・資格
      - name: learn
        label: GROWTH｜学び直し・読書
      - name: workstyle
        label: GROWTH｜仕事術・習慣
      - name: career
