    default: ''
    options:
      format: yyyy-MM-dd
  - name: draft
    label: 下書き（オンの間は公開されない）
    type: boolean
    default: true
  - name: body
    label: 本文
    type: rich-text
    options:
      format: markdown
      media: images
      path: public/images
    default: '## 結論


      （ここに結論を2〜3行で書く。記事タイプに合わせて、見出しは「記事の型（テンプレート集）」から差し替える）


      ## 根拠


      - 根拠条文：〇〇法第〇条

      - 関連通達：〇〇基本通達〇-〇-〇

      - 適用時期：YYYY/MM/DD以後に開始する事業年度から


      ## ひとことで言うと


      > ポイント：経営者に説明するときの、平易な言い換えを書く。


      ## 実務での注意点


      > 注意：期限・提出先・よくある誤りを書く。


      ## あわせて考えたいこと


      労務・補助金・経営面で関係する論点があれば一言。

      '
- name: templates
  label: 記事の型（テンプレート集）
  type: file
  path: templates/types.md
  format: yaml-frontmatter
  fields:
  - name: title
    label: タイトル
    type: string
  - name: body
    label: 本文
    type: rich-text
    options:
      format: markdown
      media: false
- name: policy
  label: 編集方針
  type: file
  path: src/content/pages/policy.md
  format: yaml-frontmatter
  fields:
  - name: title
    label: ページ名
    type: string
  - name: description
    label: 説明文（検索結果に出る）
    type: text
  - name: body
    label: 本文
    type: rich-text
    options:
      format: markdown
      media: false
- name: about
  label: このブログについて
  type: file
  path: src/content/pages/about.md
  format: yaml-frontmatter
  fields:
  - name: title
    label: ページ名
    type: string
  - name: description
    label: 説明文（検索結果に出る）
    type: text
  - name: body
    label: 本文
    type: rich-text
    options:
      format: markdown
      media: images
      path: public/images
- name: site
  label: サイト設定
  type: file
  path: src/data/site.json
  format: json
  fields:
  - name: title
    label: サイト名
    type: string
  - name: subtitle
    label: トップページのタイトルに添える一文
    type: string
  - name: tagline
    label: キャッチコピー
    type: string
  - name: description
    label: サイトの説明文（検索結果に出る）
    type: text
  - name: footerNote
    label: ページ下部の注意書き
    type: text
  - name: authorName
    label: 筆者名（記事末の筆者欄）
    type: string
  - name: authorBio
    label: 筆者紹介（記事末の筆者欄）
    type: text
  - name: keywords
    label: トップの検索窓の下に出すキーワード（6個前後）
    type: string
    list: true
  - name: featured
    label: トップの「まず読む3本」（記事のスラッグを3つ。例：officer-pay-vs-dividend）
    type: string
    list: true
