<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" role="img" aria-labelledby="t d">
<title id="t">役員報酬にかかる社会保険料率の負担割合（協会けんぽ東京支部・40〜64歳）</title>
<desc id="d">報酬に対して、会社負担は厚生年金9.15%と健康保険など6.21%（子ども・子育て拠出金0.36%を含む）の合計15.36%。本人負担は厚生年金9.15%と健康保険など5.85%の合計15.00%。</desc>
<g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Meiryo UI',Meiryo,sans-serif">
<rect x="0" y="4" width="11" height="11" rx="2" fill="#2f6f9f"/><text x="17" y="14" font-size="12.5" fill="#0b1820">厚生年金保険</text>
<rect x="0" y="24" width="11" height="11" rx="2" fill="#4f9a32"/><text x="17" y="34" font-size="12.5" fill="#0b1820">健康保険・介護保険・子ども・子育て支援金など</text>
<line x1="0" y1="50" x2="360" y2="50" stroke="#d9dde2" stroke-width="1"/>
<text x="0" y="77" font-size="13.5" font-weight="700" fill="#0b1820">会社の負担</text>
<rect x="0.0" y="86" width="165.8" height="26" fill="#2f6f9f"/>
<path d="M167.8,86 H274.4 Q278.4,86 278.4,90 V108 Q278.4,112 274.4,112 H167.8 Z" fill="#4f9a32"/>
<text x="285.4" y="104" font-size="14" font-weight="700" fill="#0b1820">15.36%</text>
<text x="82.9" y="128" font-size="12" fill="#5f666d" text-anchor="middle">厚生年金 9.15%</text>
<text x="223.1" y="128" font-size="12" fill="#5f666d" text-anchor="middle">健康保険など 6.21%</text>
<text x="0" y="157" font-size="13.5" font-weight="700" fill="#0b1820">本人の負担</text>
<rect x="0.0" y="166" width="165.8" height="26" fill="#2f6f9f"/>
<path d="M167.8,166 H267.9 Q271.9,166 271.9,170 V188 Q271.9,192 267.9,192 H167.8 Z" fill="#4f9a32"/>
<text x="278.9" y="184" font-size="14" font-weight="700" fill="#0b1820">15.00%</text>
<text x="82.9" y="208" font-size="12" fill="#5f666d" text-anchor="middle">厚生年金 9.15%</text>
<text x="219.9" y="208" font-size="12" fill="#5f666d" text-anchor="middle">健康保険など 5.85%</text>
</g></svg>
